<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Aroma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Cafeteria Aroma</h1>
        <nav>
            <a href="#">Início</a>
            <a href="#">Cardápio</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <main>
        <section class="banner">
            <h2>O melhor café da cidade</h2>
            <p>Sabores especiais preparados para você.</p>
            <button>Saiba Mais</button>
        </section>

        <section class="produtos">
            <div class="card">
                <h3>Expresso</h3>
                <p>Café forte e encorpado.</p>
            </div>

            <div class="card">
                <h3>Capuccino</h3>
                <p>Leve, cremoso e delicioso.</p>
            </div>

            <div class="card">
                <h3>Mocha</h3>
                <p>Chocolate com café premium.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Cafeteria Aroma</p>
    </footer>

</body>
</html>
